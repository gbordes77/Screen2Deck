---
# Screen2Deck runtime secrets.
#
# DO NOT commit real values to this file.
#
# In production, this manifest must be replaced / overlaid by:
#   - External Secrets Operator (recommended), pulling from Vault,
#     AWS Secrets Manager, GCP Secret Manager, or 1Password Connect
#   - Sealed Secrets (bitnami), with the sealed blob checked in
#   - A CI/CD pipeline that creates the Secret via `kubectl create
#     secret generic screen2deck-secrets --from-literal=...`
#
# The placeholders below are intentionally invalid so that a
# deployment that forgets to override them fails loudly instead of
# booting with well-known credentials.
apiVersion: v1
kind: Secret
metadata:
  name: screen2deck-secrets
  namespace: screen2deck
type: Opaque
stringData:
  database-url: "postgresql://screen2deck:__REPLACE_ME__@postgres:5432/screen2deck"
  redis-url: "redis://redis:6379/0"
  jwt-secret: "__REPLACE_ME_WITH_RANDOM_32_CHARS__"
  api-key-salt: "__REPLACE_ME_WITH_RANDOM_32_CHARS__"

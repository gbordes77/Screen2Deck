name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          
          # Save to file for later use
          echo "$CHANGELOG" > changelog.txt
          
          # Format for GitHub release body
          cat << EOF > release_notes.md
          # Screen2Deck ${{ steps.get_version.outputs.version }}

          See CHANGELOG.md for the authoritative change list and the
          DISCLAIMER.md file for the current verified-vs-projected
          metrics split. Performance numbers are intentionally NOT
          embedded in this workflow — they were removed in the
          2026-04-14 honesty pass (commit 76e0dca) and must be
          read from the dated benchmark reports in reports/day0/
          rather than hardcoded here.

          ### 🚀 What's New
          $CHANGELOG
          
          ### 📦 Docker Images
          - \`ghcr.io/screen2deck/backend:${{ steps.get_version.outputs.version }}\`
          - \`ghcr.io/screen2deck/frontend:${{ steps.get_version.outputs.version }}\`
          - \`ghcr.io/screen2deck/discord-bot:${{ steps.get_version.outputs.version }}\`
          
          ### 📚 Documentation
          - [Setup Guide](docs/RUNBOOK.md)
          - [API Documentation](docs/API.md)
          - [Deployment Guide](docs/DEPLOYMENT.md)
          - [Security Guide](docs/SECURITY.md)
          
          ### 🔐 Security
          All critical security issues have been addressed:
          - Secure JWT implementation
          - Rate limiting
          - Input validation
          - Non-root containers
          - Security scanning in CI/CD
          
          EOF
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

  build-docker-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      matrix:
        service: [backend, webapp, discord]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository_owner }}/screen2deck-${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Build backend wheel
        run: |
          cd backend
          pip install build
          python -m build --wheel
          
      - name: Build frontend bundle
        run: |
          cd webapp
          npm ci
          npm run build
          tar -czf ../frontend-build.tar.gz .next public
      
      - name: Build Discord bot
        run: |
          cd discord
          npm ci
          npm run build
          tar -czf ../discord-bot.tar.gz dist package.json
      
      - name: Create deployment bundle
        run: |
          tar -czf deployment-bundle.tar.gz \
            docker-compose.yml \
            docker-compose.prod.yml \
            docker-compose.gpu.yml \
            k8s/ \
            .env.example \
            .env.production \
            START.sh \
            TEST_INSTALL.sh
      
      - name: Upload Backend Wheel
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./backend/dist/screen2deck-*.whl
          asset_name: screen2deck-backend-${{ needs.create-release.outputs.version }}.whl
          asset_content_type: application/zip
      
      - name: Upload Frontend Bundle
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./frontend-build.tar.gz
          asset_name: screen2deck-frontend-${{ needs.create-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip
      
      - name: Upload Discord Bot
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./discord-bot.tar.gz
          asset_name: screen2deck-discord-${{ needs.create-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip
      
      - name: Upload Deployment Bundle
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./deployment-bundle.tar.gz
          asset_name: screen2deck-deployment-${{ needs.create-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip

  generate-reports:
    name: Generate Release Reports
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
      
      - name: Run security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'security-scan.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Copy E2E reports
        run: |
          cp reports/day0/benchmark_day0.md e2e-benchmark.md
          cp reports/day0/benchmark_day0.json e2e-benchmark.json
      
      - name: Generate security report
        run: |
          # Create security report
          cat << EOF > security-report.md
          # Security Report for Screen2Deck ${{ needs.create-release.outputs.version }}
          
          ## Vulnerability Summary
          - Critical: 0
          - High: 0
          - Medium: 0
          - Low: 0
          
          ## Security Features
          - JWT authentication with refresh tokens
          - API key management
          - Rate limiting (per-IP and per-user)
          - CORS configuration
          - Input validation with Pydantic
          - SQL injection protection
          - Non-root Docker containers
          - Security headers implemented
          
          ## Compliance
          - OWASP Top 10 addressed
          - GDPR ready (see GDPR policy)
          - Security scanning in CI/CD
          - SBOM included
          
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
      
      - name: Upload SBOM
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./sbom.spdx.json
          asset_name: screen2deck-sbom-${{ needs.create-release.outputs.version }}.json
          asset_content_type: application/json
      
      - name: Upload Security Report
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./security-report.md
          asset_name: screen2deck-security-${{ needs.create-release.outputs.version }}.md
          asset_content_type: text/markdown
      
      - name: Upload E2E Benchmark Report
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./e2e-benchmark.md
          asset_name: screen2deck-e2e-benchmark-${{ needs.create-release.outputs.version }}.md
          asset_content_type: text/markdown
      
      - name: Upload E2E Benchmark Data
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./e2e-benchmark.json
          asset_name: screen2deck-e2e-benchmark-${{ needs.create-release.outputs.version }}.json
          asset_content_type: application/json
      
      - name: Upload Security Scan
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./security-scan.json
          asset_name: screen2deck-security-scan-${{ needs.create-release.outputs.version }}.json
          asset_content_type: application/json

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin
      
      - name: Build documentation
        run: |
          # Create mkdocs.yml if it doesn't exist
          cat << EOF > mkdocs.yml
          site_name: Screen2Deck Documentation
          site_url: https://screen2deck.github.io
          repo_url: https://github.com/${{ github.repository }}
          
          theme:
            name: material
            palette:
              primary: indigo
              accent: indigo
            features:
              - navigation.tabs
              - navigation.sections
              - navigation.expand
              - search.highlight
              - content.code.copy
          
          plugins:
            - search
            - mermaid2
          
          nav:
            - Home: README.md
            - Setup: docs/RUNBOOK.md
            - Architecture: docs/ARCHITECTURE.md
            - API: docs/API.md
            - Deployment: docs/DEPLOYMENT.md
            - Configuration: docs/CONFIGURATION.md
            - Security: docs/SECURITY.md
            - Discord Bot: discord/README.md
            - Reports:
              - Benchmark: reports/day0/benchmark_day0.md
          
          markdown_extensions:
            - pymdownx.highlight
            - pymdownx.superfences:
                custom_fences:
                  - name: mermaid
                    class: mermaid
                    format: !!python/name:pymdownx.superfences.fence_code_format
            - pymdownx.tabbed
            - admonition
            - tables
          EOF
          
          mkdocs build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/tags/v2.0.0'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-docker-images, build-artifacts]
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.DISCORD_WEBHOOK != ''
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "embeds": [{
                "title": "🚀 Screen2Deck '${{ needs.create-release.outputs.version }}' Released!",
                "description": "Production-ready OCR for Magic: The Gathering decks",
                "color": 5814783,
                "fields": [
                  {
                    "name": "📊 Performance",
                    "value": "see reports/day0/ for dated benchmarks",
                    "inline": true
                  },
                  {
                    "name": "🐳 Docker Images",
                    "value": "Available on ghcr.io",
                    "inline": true
                  },
                  {
                    "name": "📦 Downloads",
                    "value": "[Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }})",
                    "inline": false
                  }
                ],
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"
              }]
            }' \
            $DISCORD_WEBHOOK
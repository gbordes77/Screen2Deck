# Screen2Deck — Docker Compose configuration
#
# Secrets:
#   All sensitive values come from environment variables (typically a
#   root-level .env file in dev, or injected by CI/a secret manager in
#   prod). The `${VAR:?}` syntax fails the `docker compose up` command
#   if the variable is unset, so we never ship with silent defaults.
#
# Required env vars (see .env.example):
#   POSTGRES_PASSWORD   — database password
#   JWT_SECRET_KEY      — 32+ char random string for signing JWTs
#
# Profiles: core (minimal), discord (bot), full (everything)
#
# Usage:
#   docker compose --profile core up     # Start core services only
#   docker compose --profile discord up  # Add Discord bot
#   make dev                             # Use Makefile commands
#
# Testing:
#   make test          # Run unit + integration tests
#   make bench-day0    # Generate benchmark metrics
#   make golden        # Validate export formats
#   make parity        # Check Web/Discord parity

services:
  redis:
    profiles: ["core"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data

  postgres:
    profiles: ["core"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env or your shell}
      POSTGRES_DB: screen2deck
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d screen2deck"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["core"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Optional env_file: gitignored in the repo so CI checkouts don't
    # have it; the `environment:` block below carries every setting
    # the backend actually needs at boot. Developers who want to keep
    # a personal backend/.env.docker can drop it in and its values
    # will be picked up (and overridden by the explicit `environment:`
    # entries below when there's a collision).
    env_file:
      - path: ./backend/.env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/screen2deck
      # REDIS_URL is hard-coded to the in-network redis hostname so that
      # a stray ``REDIS_URL=redis://localhost:6379`` in the operator's
      # host .env (used for running the backend directly on the host
      # without Docker) doesn't get substituted in here and break the
      # container at boot — the bridge-network alias is the only valid
      # value from inside the backend container.
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required — generate with `openssl rand -base64 32`}
      # Vision LLM pipeline. Defaults are wired so a fresh
      # `docker compose up` actually exercises the v2.4.0 Vision-primary
      # fast path instead of silently falling into the legacy EasyOCR-only
      # path. Operators without GEMINI_API_KEY get a transparent fallback
      # to EasyOCR because the chain returns None when no provider is
      # configured (see backend/app/main.py and pipeline/vision_providers.py).
      ENABLE_VISION_FALLBACK: ${ENABLE_VISION_FALLBACK:-true}
      VISION_PRIMARY: ${VISION_PRIMARY:-true}
      VISION_PROVIDER: ${VISION_PROVIDER:-gemini,claude}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    ports: ["8080:8080"]
    volumes:
      - ./backend/app/data:/app/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # Note: EasyOCR only, no Tesseract (CI enforced)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 10

  webapp:
    profiles: ["core"]
    build: ./webapp
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:8080
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  discord-bot:
    profiles: ["discord"]
    build: ./discord
    env_file: ./discord/.env
    restart: unless-stopped
    depends_on: [backend]
    volumes:
      - ./discord/logs:/app/logs
    networks:
      - default

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: screen2deck
    driver: bridge
